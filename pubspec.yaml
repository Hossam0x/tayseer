  uuid: ^4.5.1
  video_player: ^2.10.1
  visibility_detector: ^0.4.0+2
  # webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  zego_uikit: ^2.28.41
  zego_uikit_prebuilt_call: ^4.22.2
