  pretty_dio_logger: ^1.4.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  hive_generator: ^2.0.1

dependency_overrides:
  vector_math: ^2.2.0
  record_linux: 0.7.1
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/lang/
    - assets/sounds/
    - .env

  fonts:
    - family: ibmp
      fonts:
        - asset: assets/font/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/font/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/font/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/font/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_logo_icon.png"
